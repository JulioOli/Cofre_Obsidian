# Regras de auditoria semanal (foco: custos/despesas fixas da reuniao).
#
# Contas foco:
# - 7.5.1  AGUA E ESGOTO
# - 7.5.2  ENERGIA ELETRICA
# - 7.5.20 INTERNET
# - 7.5.3  TELECOMUNICACOES
# - 7.5.31 ALUGUEIS ADMINISTRATIVO
# - 5.1    LOCACAO DE MAQUINAS E EQUIPAMENTOS
# - 7.3.23 HONORARIOS PJ
#
# Observacoes:
# - `codcdc` aceita padroes com `X` e `*`.
# - `usar_referencia_fechamento: true` usa o arquivo de fechamento
#   (Lancamentos_CustosFixos_e_DespesasFixas_Fechamento2026.xlsx)
#   para aprender padrao de credor e faixa de valor.
# - Registros migrados (vencimento 1800-01-01) sao ignorados por padrao no script.

regras:
  # ---------------------------------------------------------------------------
  # 7.5.1 - AGUA E ESGOTO
  # ---------------------------------------------------------------------------
  - nome: "7.5.1 - Ausencia mensal (Agua e Esgoto)"
    tipo: ausencia_mensal
    codcdc: "7.5.1"
    dia_esperado: 10
    tolerancia_dias: 10
    severidade: ALTA

  - nome: "7.5.1 - Credor fora do padrao"
    tipo: fornecedor_inesperado
    codcdc: "7.5.1"
    usar_referencia_fechamento: true
    severidade: MEDIA

  - nome: "7.5.1 - Valor fora do padrao"
    tipo: desvio_valor
    codcdc: "7.5.1"
    usar_referencia_fechamento: true
    margem_pct_referencia: 0.20
